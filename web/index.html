<style>
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 400; font-display: swap; src: url(vendor/fonts/schibsted-grotesk-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 500; font-display: swap; src: url(vendor/fonts/schibsted-grotesk-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 700; font-display: swap; src: url(vendor/fonts/schibsted-grotesk-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Anton'; font-weight: 400; font-display: swap; src: url(vendor/fonts/anton-latin-400-normal.woff2) format('woff2'); }
  /* heap colours (rebrand epic, issue 156): charcoal on soft white; photos bring the colour */
  :root { --ink: #382A2B; --paper: #F6F3F2; --text-mid: #6E5E5F; --line: #E4DEDC; --scrim: #382A2BB3;
    --ui: 'Schibsted Grotesk', system-ui, sans-serif; --display: 'Anton', 'Schibsted Grotesk', sans-serif; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden;
    font-family: var(--ui); touch-action: none; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 8px; top: calc(8px + env(safe-area-inset-top)); font: 500 12px/1.45 var(--ui);
    background: var(--paper); color: var(--text-mid); border: 1.5px solid var(--line); padding: 6px 9px; border-radius: 10px; white-space: pre; pointer-events: none; }
  button, label, input { font-family: var(--ui); }
  #bar { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  #bar label, #bar button { font-size: 16px; font-weight: 500; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
  #bar input[type=file] { display: none; }
  #bar input[type=checkbox] { width: 18px; height: 18px; vertical-align: -3px; margin: 0 6px 0 0; accent-color: var(--ink); }
  [hidden] { display: none !important; }
  /* home: a big glyph off the top, the wordmark, two tall card buttons (Figma "02 · Home") */
  #lobby { position: fixed; inset: 0; z-index: 5; background: var(--paper); overflow: hidden auto; touch-action: pan-y; }
  #lobby .blob { position: absolute; width: min(150vw, 640px); aspect-ratio: 1; right: -18vw; top: max(-30vw, -170px); background: var(--ink);
    -webkit-mask: url(img/g03.svg) center / contain no-repeat; mask: url(img/g03.svg) center / contain no-repeat; pointer-events: none; }
  #lobby .home { position: relative; min-height: 100%; box-sizing: border-box; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 24px calc(28px + env(safe-area-inset-bottom)); gap: 14px; }
  #lobby .tag { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-mid); margin: 0; }
  /* the wordmark: he[a]p, only the a is a glyph, and it reaches for the pointer (component lab, section 28) */
  #lobby .mark { font: 700 112px/.8 var(--ui); letter-spacing: -.065em; white-space: nowrap; display: flex; align-items: baseline; margin: 0 0 10px -6px; color: var(--ink); }
  #lobby .mark canvas { width: 1em; height: 1em; align-self: center; margin: 0 -.2em 0 -.2em; transform: translateY(-.02em); }
  #lobby .about { font-size: 17px; line-height: 1.45; margin: 0 0 18px; }
  .card { display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; width: 100%; min-height: 92px; padding: 14px 22px 14px 26px;
    border-radius: 22px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
  .card b { display: block; font: 400 32px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
  .card small { display: block; font-size: 14px; margin-top: 6px; }

  .card.solid i { background: var(--paper); }
  .card.join i { -webkit-mask-image: url(img/g09.svg); mask-image: url(img/g09.svg); }
  .card:focus-visible, #f button:focus-visible, #f input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #f { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  #f label { grid-column: 1 / -1; font-size: 14px; color: var(--text-mid); }
  #f input { font: 400 26px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; min-width: 0; padding: 12px 14px;
    border-radius: 16px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
  #f button { font: 400 22px/1 var(--display); text-transform: uppercase; padding: 0 22px; border-radius: 16px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); }

  #lobby .note { font-size: 13px; line-height: 1.4; color: var(--text-mid); margin: 4px 0 0; }
  #invitebox { position: fixed; inset: 0; display: grid; place-items: center; background: var(--scrim); z-index: 4; }
  #invitebox > div { display: grid; gap: 12px; justify-items: center; background: var(--paper); color: var(--ink); padding: 18px; border-radius: 20px; max-width: calc(100vw - 40px); text-align: center; }
  #qr { width: min(260px, 70vw); height: auto; image-rendering: pixelated; border-radius: 8px; }
  #link { font: 13px var(--ui); width: min(320px, 80vw); padding: 8px; border-radius: 12px; border: 2px solid var(--ink);
    background: var(--paper); color: var(--ink); -webkit-user-select: text; user-select: text; }
  #invitebox button { font-size: 16px; font-weight: 500; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); }
  #toast { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 9px 15px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 6; }
</style>

<body>
<canvas id="c"></canvas>

<div id="bar"><button id="invite" type="button" hidden>Invite</button><label><input id="keep" type="checkbox">Keep details</label><button id="saveall" type="button">Save all</button><label>＋ Photos<input id="pick" type="file" accept="image/*,video/*" multiple></label></div>
<div id="lobby">
  <div class="blob" aria-hidden="true"></div>
  <div class="home">

  <canvas id="qr"></canvas>

</div></div>

<script type="module">
import { joinRoom } from './net.js';
import { solveLayout } from './layout.js';
import { createPeers, SendTimeout } from './peers.js';
import { prepareFile } from './strip.js';
import { saveBatch, createSaveAll, REVOKE_AFTER } from './saveall.js';
import { pickRoom, inviteLink, cleanUrl, watchJoin, ROOM_KEY } from './invite.js';
import { LIMITS, validPrint, validMove, validChunk, validPidMsg, validNeed, inRoom, askBytes, askLimiter, thumbFits, isRoomCode, CODE_ALPHABET, sha256Hex } from './check.js';

const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const rnd = new Uint32Array(2); crypto.getRandomValues(rnd);
const id = rnd[0].toString(36) + rnd[1].toString(36);
const NAMES = ['Comet', 'Pebble', 'Mango', 'Gecko', 'Noodle', 'Biscuit', 'Pickle', 'Waffle', 'Nova', 'Sprout'];
const name = NAMES[rnd[0] % NAMES.length];
const params = new URLSearchParams(location.search);
// This tab's room (S16): written only once a join is live, so a reload goes straight back in.
// sessionStorage can throw (storage turned off): the tab then just doesn't remember the room
const stored = { get: () => { try { return sessionStorage.getItem(ROOM_KEY); } catch { return null; } },
  set: (code) => { try { sessionStorage.setItem(ROOM_KEY, code); } catch {} } };
const opening = pickRoom(location.search, stored.get());
$('code').value = opening.fill;

// A room code people can't guess: 10 characters from a 32-letter alphabet (50 bits).
function newCode() {
  const b = new Uint8Array(10);
  crypto.getRandomValues(b);
  return [...b].map((x) => CODE_ALPHABET[x & 31]).join('');
}
// Start a heap makes a code and starts at once; Join with a code shows the code form (heap home, issue 158)
import('./heap-a.js').then(({ reacher, A_GLYPH }) => reacher($('heap-a'), A_GLYPH, { colour: getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() }));
const showForm = (on) => { $('f').hidden = !on; $('choose').hidden = on; if (on) $('code').focus(); };
$('new').onclick = () => { const c = newCode(); $('code').value = c; tryStart(c); };
$('joinwith').onclick = () => showForm(true);
$('back').onclick = () => showForm(false);
if ($('code').value) showForm(true);

let net = null, peers = null, W = innerWidth, H = innerHeight;
// A sticky message stays until unstick(). Other messages show over it for a moment, then it comes back
function toast(msg, sticky = false) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.h);
  if (sticky) toast.sticky = msg;
  else toast.h = setTimeout(() => { if (toast.sticky) t.textContent = toast.sticky; else t.style.opacity = 0; }, 2400);
}
function unstick() { if (toast.sticky && $('toast').textContent === toast.sticky) $('toast').style.opacity = 0; toast.sticky = null; }
function resize() {
  W = innerWidth; H = innerHeight;
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  net?.resize(W, H);
}
addEventListener('resize', resize); resize();

// ---------- prints ----------
// Every print on the table, mine and other people's. Positions are in world coordinates
// (the shared space made by joining screens), so a print can sit across a seam.
// { pid, owner, name, type, size, x, y, w, h, rot, img, file (if I hold the bytes), holders }
const prints = new Map();
const files = new Map();      // pid -> File (bytes I hold)
const incoming = new Map();   // pid -> { parts: [], got, n }
const asks = askLimiter();    // how much each device has made us send of each file (S1.5)
// Give back the share of an allowed send that never left. `s` is sendFile's { sent, of }; anything
// else (an error that couldn't say) gives nothing back, so a send that moved data stays counted.
const refund = (tok, s) => { if (s && Number.isInteger(s.sent) && s.of > 0 && s.sent < s.of) asks.undo(tok, (s.of - s.sent) / s.of); };
let layout = { pos: {}, group: {} }, sizes = {};
const meWorld = () => layout.pos[id] || [0, 0];
// A print's x, y are relative to the top-left of the screen it sits on (its anchor), so
// joining screens (which can shift the shared coordinates) never makes prints jump.
const world = (p) => { const o = layout.pos[p.anchor] || [0, 0]; return [o[0] + p.x, o[1] + p.y]; };
const visible = (p) => (layout.group[p.anchor] || p.anchor) === (layout.group[id] || id);
// A print whose screen has left the room moves to the screen with the smallest id in my
// group (every device picks the same one), keeping its place clamped inside that screen.
function rehome() {
  const gid = layout.group[id] || id;
  let host = null;
  for (const k of Object.keys(sizes)) if ((layout.group[k] || k) === gid && (host === null || k < host)) host = k;
  for (const p of prints.values()) {
    if (sizes[p.anchor] || !host || (drag && drag.p === p)) continue;
    p.anchor = host;
    p.x = Math.max(0, Math.min(sizes[host].w - p.w, p.x));
    p.y = Math.max(0, Math.min(sizes[host].h - p.h, p.y));
  }
}
function setWorld(p, x, y) {
  p.anchor = screenAt(x + p.w / 2, y + p.h / 2) || p.anchor; // re-anchor to the screen under its middle
  const o = layout.pos[p.anchor] || [0, 0];
  p.x = x - o[0]; p.y = y - o[1];
}

async function thumbOf(file) {
  if (!file.type.startsWith('image/')) return null;
  try {
    const bmp = await createImageBitmap(file);
    const s = 220 / Math.max(bmp.width, bmp.height);
    const c = new OffscreenCanvas(Math.max(1, Math.round(bmp.width * s)), Math.max(1, Math.round(bmp.height * s)));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close();
    const blob = await c.convertToBlob({ type: 'image/jpeg', quality: 0.7 });
    return new Uint8Array(await blob.arrayBuffer());
  } catch { return null; } // can't decode it: it goes on the table without a picture
}
async function imgFrom(bytes) {
  if (!bytes) return null;
  try { return await createImageBitmap(new Blob([bytes], { type: 'image/jpeg' })); } catch { return null; }
}
const pidOf = () => { const b = new Uint8Array(8); crypto.getRandomValues(b); return [...b].map((x) => x.toString(16).padStart(2, '0')).join(''); };

$('pick').onchange = async (e) => {
  const list = [...e.target.files];
  e.target.value = '';
  const keep = $('keep').checked;   // the choice made for this pick, even if the box changes while it runs
  let added = 0;
  const kept = [];   // files sent with their details still in them
  for (const picked of list) {
    if (picked.size > LIMITS.fileBytes) { toast(`${picked.name} is too big`); continue; }
    // location and camera details come out of JPEGs before the fingerprint is taken (S6)
    const { file, warn } = await prepareFile(picked, keep);
    if (warn) kept.push(file.name);
    const pid = pidOf(), thumb = await thumbOf(file), sha = await sha256Hex(file); // receivers check the file against this
    const w = 150, h = thumb ? 150 : 110;
    const p = { pid, owner: id, name: file.name.slice(0, 200) || 'file', type: file.type.slice(0, 100), size: file.size, sha,
      anchor: id, x: 40 + Math.random() * Math.max(10, W - 230), y: 70 + Math.random() * Math.max(10, H - 300),
      w, h, rot: (Math.random() - 0.5) * 0.3, img: await imgFrom(thumb), thumb, holders: [id] };
    prints.set(pid, p); files.set(pid, file); added++;
    broadcast((peer) => announce(peer, p));
  }
  if (added) toast(`${added} on the table` + (kept.length ? `. Details not removed from ${kept.join(', ')}` : ''));
};

const others = () => Object.keys(net?.peers || {}).filter((k) => k !== id);
const broadcast = (f) => others().forEach(f);
const announced = new Map(); // pid -> devices we've announced it to
const sentTo = (pid) => announced.get(pid) || announced.set(pid, new Set()).get(pid);
function announce(peer, p) {
  sentTo(p.pid).add(peer);   // counted while it's on the way, so it isn't announced twice
  const { img, thumb, lastSource, ...meta } = p;
  // dropped (the device stopped answering): forget it, so the catch-up announces it again
  peers.send(peer, { t: 'print', ...meta, thumbSize: thumb?.length || 0 }).then((sent) => { if (!sent) sentTo(p.pid).delete(peer); });
  if (thumb) peers.sendFile(peer, 'thumb:' + p.pid, new Blob([thumb])).catch(() => {});   // the receiver asks again
}

// ---------- messages between devices ----------
// Transfers we've asked for (or been told to expect): fid -> { from, size, parts, got, n, cs, last, asks }.
// Pieces for anything else are dropped, so a stranger can't make us store data.
function expect(fid, from, size) {
  if (incoming.has(fid) || incoming.size >= LIMITS.incoming) return false;   // full: the caller says so, and doesn't ask
  incoming.set(fid, { from, size, parts: null, got: 0, n: 0, cs: 0, last: performance.now(), asks: 0 });
  return true;
}
function onMessage(from, m, bytes) {
  if (m.t === 'print') {
    if (prints.has(m.pid) || prints.size >= LIMITS.prints || !validPrint(m)) return;
    const { t, thumbSize, ...meta } = m;
    prints.set(m.pid, { ...meta, img: null, thumb: null });
    if (thumbSize) expect('thumb:' + m.pid, from, thumbSize);
  } else if (m.t === 'move') {
    if (!validMove(m)) return;
    const p = prints.get(m.pid); if (p && drag?.p !== p) { p.anchor = m.anchor; p.x = m.x; p.y = m.y; }
  } else if (m.t === 'want') {           // someone wants the full photo
    const file = validPidMsg(m) && files.get(m.pid);
    // counted only for devices in the room (S7), then given back for what never left (S1.5)
    const tok = file && inRoom(net.peers, from) && asks.allow(from, m.pid, askBytes(m, file.size), file.size, false);
    if (tok) peers.sendFile(from, m.pid, file).then((s) => refund(tok, s), (e) => { refund(tok, e?.sent); gaveUp(from, m.pid, e); });
  } else if (m.t === 'have') {           // someone now holds the bytes
    const p = validPidMsg(m) && prints.get(m.pid);
    if (p && !p.holders.includes(from) && p.holders.length < 50) p.holders.push(from);
  } else if (m.t === 'need') {           // receiver is missing pieces (null = all): resend them
    if (!validNeed(m)) return;
    const pid = m.fid.startsWith('thumb:') ? m.fid.slice(6) : m.fid;
    const thumb = prints.get(pid)?.thumb;
    const src = m.fid.startsWith('thumb:') ? (thumb && new Blob([thumb])) : files.get(pid);
    const cs = LIMITS.chunkSizes.includes(m.cs) ? m.cs : null;
    // only files we hold, then only lists a receiver could send, from devices in the room, are
    // counted (S1.5); what never left is given back, so a link that recovers isn't refused (Qodo on #87)
    const bytes = src && askBytes(m, src.size);
    const tok = typeof bytes === 'number' && inRoom(net.peers, from) && asks.allow(from, m.fid, bytes, src.size, m.missing !== null);
    if (tok) peers.sendFile(from, m.fid, src, m.missing, m.missing ? cs : null).then((s) => refund(tok, s), (e) => { refund(tok, e?.sent); if (m.fid === pid) gaveUp(from, pid, e); });
  } else if (m.t === 'chunk') {
    const inc = incoming.get(m.fid);
    if (!inc || inc.from !== from || !validChunk(m, bytes, inc)) return;
    if (!inc.parts || inc.cs !== m.cs) { inc.parts = new Array(m.n); inc.got = 0; inc.n = m.n; inc.cs = m.cs; }
    inc.last = performance.now();
    if (!inc.parts[m.i]) { inc.parts[m.i] = bytes.slice(); inc.got++; }
    if (inc.got === inc.n) { incoming.delete(m.fid); done(m.fid, inc.parts); }
  }
  // any other message type has no check, so it is dropped
}
// A send was cancelled (S1.3). They can ask again. Only a timeout is the other device's fault.
function gaveUp(to, pid, e) {
  const timedOut = e instanceof SendTimeout;
  if (!timedOut) console.warn('send failed', to, pid, e);
  toast(`Couldn’t send ${prints.get(pid)?.name || 'a photo'} to ${net.peers[to]?.name || 'a device'}` + (timedOut ? ': it stopped answering' : ''));
}
async function done(fid, parts) {
  if (fid.startsWith('thumb:')) {
    const p = prints.get(fid.slice(6));
    const thumb = new Uint8Array(await new Blob(parts).arrayBuffer());
    // decoded only if its header says it is small (S14). Otherwise it isn't kept or passed on: a plain card
    if (p && thumbFits(thumb)) { p.thumb = thumb; p.img = await imgFrom(thumb); }
    return;
  }
  const p = prints.get(fid); if (!p) return;
  // the bytes must match the fingerprint announced with the print, or it isn't the photo
  if (await sha256Hex(parts) !== p.sha) {
    const from = p.holders.find((k) => k !== id && net.peers[k] && k !== p.lastSource);
    p.holders = p.holders.filter((k) => k !== p.lastSource);   // stop trusting that source
    toast(from ? 'That copy was damaged. Trying another' : 'That copy was damaged. Drag it again to retry');
    if (from) { p.lastSource = from; expect(p.pid, from, p.size); peers.send(from, { t: 'want', pid: p.pid }); }
    return;
  }
  const file = new File(parts, p.name, { type: p.type, lastModified: Date.now() });
  files.set(fid, file);
  if (!p.holders.includes(id)) p.holders.push(id);
  broadcast((peer) => peers.send(peer, { t: 'have', pid: fid }));
  toast(`Got ${p.name}. Tap it to save`);
}

// Ask again for pieces that went missing (relay messages can be dropped under load). If
// nothing at all has arrived, ask for the whole file. Give up after a minute of silence.
setInterval(() => {
  for (const [fid, inc] of incoming) {
    const idle = performance.now() - inc.last;
    if (idle < 3000) continue;
    if (inc.asks >= 20) { incoming.delete(fid); if (!fid.startsWith('thumb:')) toast('A photo didn’t arrive. Drag it again to retry'); continue; }
    let missing = null;
    if (inc.parts) { missing = []; for (let i = 0; i < inc.n && missing.length < LIMITS.missingPerAsk; i++) if (!inc.parts[i]) missing.push(i); }
    inc.last = performance.now(); inc.asks++;
    peers.send(inc.from, { t: 'need', fid, missing, cs: inc.cs || undefined });
  }
}, 1500);

// Whose screen is a world point on?
function screenAt(x, y) {
  const gid = layout.group[id] || id;
  for (const k of Object.keys(sizes)) {
    if ((layout.group[k] || k) !== gid) continue;
    const [px, py] = layout.pos[k] || [0, 0];
    if (x >= px && x < px + sizes[k].w && y >= py && y < py + sizes[k].h) return k;
  }
  return null;
}
const onMyScreen = (p) => { const [x, y] = world(p); return screenAt(x + p.w / 2, y + p.h / 2) === id; };
function dropped(p) {
  // landed on my screen and I don't have it yet: ask the owner for the full photo
  if (onMyScreen(p) && !files.has(p.pid) && !incoming.has(p.pid)) {
    const src = p.holders.find((k) => k !== id && net.peers[k]) || p.owner;
    if (!expect(p.pid, src, p.size)) return toast('Too many photos arriving. Try again in a moment');
    p.lastSource = src;
    peers.send(src, { t: 'want', pid: p.pid });
    toast('Receiving…');
  }
}

// ---------- input: orb (join screens), prints (drag / tap to save) ----------
const ORB = 26;
const home = () => [W / 2, H - 120];
let drag = null, orbDrag = null, ghosts = [];
function hit(sx, sy) {
  const [mx, my] = meWorld(), x = sx + mx, y = sy + my;
  return [...prints.values()].reverse().find((p) => { if (!visible(p)) return false; const [px, py] = world(p); return x >= px && x <= px + p.w && y >= py && y <= py + p.h; });
}
cv.addEventListener('pointerdown', (e) => {
  const [hx, hy] = home();
  cv.setPointerCapture(e.pointerId);
  if (Math.hypot(e.clientX - hx, e.clientY - hy) < ORB * 2) { orbDrag = { x: e.clientX, y: e.clientY }; return; }
  const p = hit(e.clientX, e.clientY);
  if (!p) return;
  prints.delete(p.pid); prints.set(p.pid, p); // bring to top
  const [ox, oy] = world(p);
  drag = { p, sx: e.clientX, sy: e.clientY, ox, oy, moved: false };
});
let lastSend = 0;
cv.addEventListener('pointermove', (e) => {
  if (orbDrag) { orbDrag.x = e.clientX; orbDrag.y = e.clientY; return; }
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.hypot(dx, dy) > 8) drag.moved = true;
  setWorld(drag.p, drag.ox + dx, drag.oy + dy);
  if (performance.now() - lastSend > 40) { lastSend = performance.now(); const p = drag.p; broadcast((k) => peers.send(k, { t: 'move', pid: p.pid, anchor: p.anchor, x: p.x, y: p.y })); }
});
cv.addEventListener('pointerup', (e) => {
  if (orbDrag) { pushOrb(orbDrag.x, orbDrag.y); orbDrag = null; return; }
  if (!drag) return;
  const p = drag.p, moved = drag.moved; drag = null;
  if (!moved) return save(p);   // a tap
  broadcast((k) => peers.send(k, { t: 'move', pid: p.pid, anchor: p.anchor, x: p.x, y: p.y, final: true }));
  broadcast((k) => peers.send(k, { t: 'dropcheck', pid: p.pid }));
  dropped(p);
});
// Saving must happen inside the tap, with the file already in hand (iOS rule).
function save(p) {
  const file = files.get(p.pid);
  if (!file) {
    if (p.owner === id) return toast('Yours');
    if (incoming.has(p.pid)) return toast('Receiving…');   // already asked: don't ask twice
    if (onMyScreen(p)) return dropped(p);                  // on my screen: a tap fetches it, like a drop (C6)
    return toast('Drag it onto your screen first');
  }
  if (p.owner === id) return toast('Already yours');
  // handed over once it was shared or its download started, so Save all doesn't save it again (F13)
  if (navigator.canShare?.({ files: [file] })) navigator.share({ files: [file] }).then(() => saveAll.handed.add(p.pid), () => {});
  else { downloadFile(file); saveAll.handed.add(p.pid); }
}
function downloadFile(file) {
  const a = document.createElement('a'), url = URL.createObjectURL(file);
  a.href = url; a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), REVOKE_AFTER);
}
// Save all (F13): every received photo in one tap. The share sheet once with all of them, or downloads
const saveAll = createSaveAll({
  batch: (handed) => saveBatch({ prints, files, incoming, me: id, handed }),
  canShare: (list) => !!navigator.share && !!navigator.canShare?.({ files: list }),
  share: (list) => navigator.share({ files: list }),
  download: downloadFile,
  toast,
});
$('saveall').onclick = () => saveAll.tap();
function pushOrb(x, y) {
  const [hx, hy] = home(), dx = x - hx, dy = y - hy;
  if (Math.hypot(dx, dy) < Math.min(W, H) * 0.15) return;
  let edge, along;
  if (Math.abs(dx) / W > Math.abs(dy) / H) { edge = dx > 0 ? 'R' : 'L'; along = Math.max(0, Math.min(H, hy + dy * (((dx > 0 ? W : 0) - hx) / dx))); }
  else { edge = dy > 0 ? 'B' : 'T'; along = Math.max(0, Math.min(W, hx + dx * (((dy > 0 ? H : 0) - hy) / dy))); }
  const g = edge === 'R' ? [W, along] : edge === 'L' ? [0, along] : edge === 'B' ? [along, H] : [along, 0];
  ghosts.push({ x: g[0], y: g[1], t: performance.now() });
  net.push(edge, along);
}

// ---------- start ----------
function start(room) {
  $('lobby').hidden = true;
  const attempt = net = joinRoom({ room: 'photo-' + room, id, name, size: { w: W, h: H }, onSignal: (from, d, away) => peers.onSignal(from, d, away), onReturn: (from) => peers.returned(from), linked: (from) => peers.linked(from) });
  peers = createPeers({ myId: id, table: room, signal: (to, d) => net.signal(to, d), forceRelay: params.has('relay'), present: (p) => inRoom(net.peers, p) });
  peers.on((from, m, bytes) => {
    if (m.t === 'dropcheck') { const p = validPidMsg(m) && prints.get(m.pid); if (p) dropped(p); return; }
    onMessage(from, m, bytes);
  });
  const known = new Set();
  // Catch everyone up. The owner announces its prints; once the owner has left, anyone
  // still holding a print announces it. Re-checked on every change in who's here, because
  // a device that closes can take a while to drop out of the room, and whenever a device's
  // key arrives, because a print to it may have been dropped while we waited (S1.3).
  const catchUp = () => {
    for (const p of prints.values()) {
      if (!(p.owner === id || (!net.peers[p.owner] && files.has(p.pid)))) continue;
      for (const k of others()) if (!sentTo(p.pid).has(k)) announce(k, p);
    }
  };
  peers.onReady(catchUp);
  net.on((ev) => {
    if (ev !== 'peers') return;
    for (const k of others()) if (!known.has(k)) { known.add(k); peers.connect(k); } // swap keys, try a direct link
    catchUp();
  });
  // Join results go to the whole room: each one is shown only on the devices it names.
  // For results that answer this device's latest push (d.latest), until it pushes again,
  // "Joined" always wins and "Try again" stays on screen and isn't replaced by "No match".
  // A late join for an earlier push still says "Joined" if the latest push has no answer yet,
  // since those screens did join, but it doesn't hide what the latest push gets. A late
  // retry or nomatch for an earlier push shows nothing: the person has already tapped again
  const SIDE = { R: 'on your right', L: 'on your left', T: 'above you', B: 'below you' };
  let said = null;   // 'joined' or 'retry' since this device's last push
  net.on((ev, d) => {
    if (ev === 'pushed') { said = null; unstick(); }
    else if (ev === 'joined' && (d.a === id || d.b === id) && (d.latest || !said)) {
      const mine = d.a === id, other = net.peers[mine ? d.b : d.a]?.name || 'a device';
      if (d.latest) { said = 'joined'; unstick(); }
      toast(`Joined with ${other}, ${SIDE[mine ? d.edgeA : d.edgeB]}`);
    } else if (ev === 'retry' && d.latest && said !== 'joined') {
      said = 'retry';
      toast('Couldn’t tell who to join. Try again', true);
    } else if (ev === 'nomatch' && d.latest && !said) toast('No match. Tap again together');
  });
  // Joined means the channel reports live (S16). Only then does the code leave the address bar
  // (the current history entry is replaced, so Back has no page with it) and go into this tab's
  // sessionStorage. A join that fails before live is shut down, so a late live from it can't enter
  // the room, and the lobby comes back with the code and the address bar as they were
  watchJoin(attempt, {
    joined: () => {
      if (net !== attempt) return;
      history.replaceState(null, '', cleanUrl(location.href));
      stored.set(room);
      invite.room = room; $('invite').hidden = false;
    },
    failed: () => {
      if (net !== attempt) return;
      attempt.leave();
      $('code').value = room; $('lobby').hidden = false; showForm(true);
      toast('Couldn’t join the room. Try again');
    },
  });
  window.__t = { net, peers, prints, files, incoming, expect, onMessage, id, screenAt, dropped, newCode, world, setWorld, get layout() { return layout; } };
}

// ---------- invite (S16) ----------
// The room's link and its QR code, drawn here by the vendored qrcode-generator: the code never
// goes to an outside service. Anyone who sees either can join, the same as with a typed code
const invite = { room: null };
function drawQr(text) {
  const qr = window.qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), QUIET = 4, CELL = 8, c = $('qr'), g = c.getContext('2d');
  c.width = c.height = (n + 2 * QUIET) * CELL;
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect((k + QUIET) * CELL, (r + QUIET) * CELL, CELL, CELL);
}
$('invite').onclick = () => {
  if (!invite.room) return;
  const link = inviteLink(location.href, invite.room);
  $('link').value = link; drawQr(link);
  $('invitebox').hidden = false;
};
$('closeinvite').onclick = () => { $('invitebox').hidden = true; };
// No Clipboard API (plain http on a LAN), or it's refused: select the link to copy by hand
$('copy').onclick = async () => {
  const l = $('link');
  try { await navigator.clipboard.writeText(l.value); toast('Link copied'); }
  catch { l.focus(); l.select(); l.setSelectionRange(0, l.value.length); toast('Couldn’t copy. The link is selected'); }
};
// Only codes made by New room are accepted: a hand-typed code like TEST is easy to guess.
function tryStart(code) {
  code = code.trim().toUpperCase();
  if (!isRoomCode(code)) return toast('Use New room to make a 10-letter code');
  start(code);
}
$('f').onsubmit = (e) => { e.preventDefault(); tryStart($('code').value); };
if (opening.join) tryStart(opening.join);

// ---------- drawing ----------
function frame() {
  requestAnimationFrame(frame);
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = '#2b1d14'; ctx.fillRect(0, 0, W, H);
  if (!net) return;
  sizes = Object.fromEntries(Object.entries(net.peers).map(([k, p]) => [k, { w: p.w, h: p.h }]));
  if (!sizes[id]) sizes[id] = { w: W, h: H };
  layout = solveLayout(Object.keys(sizes), net.joins, sizes);
  rehome();
  const [mx, my] = meWorld(), gid = layout.group[id] || id;
  ctx.save(); ctx.translate(-mx, -my);
  // wood-grain-ish lines that run straight across joined screens
  ctx.strokeStyle = '#3a281b'; ctx.lineWidth = 2;
  for (let y = Math.floor(my / 46) * 46; y < my + H; y += 46) { ctx.beginPath(); ctx.moveTo(mx, y + Math.sin(y) * 4); ctx.lineTo(mx + W, y); ctx.stroke(); }
  ctx.strokeStyle = '#7a5a3a'; ctx.setLineDash([6, 6]);
  for (const k of Object.keys(sizes)) if (k !== id && layout.group[k] === gid) ctx.strokeRect(layout.pos[k][0] + 1, layout.pos[k][1] + 1, sizes[k].w - 2, sizes[k].h - 2);
  ctx.setLineDash([]);
  for (const p of prints.values()) {
    if (!visible(p)) continue;
    const [px, py] = world(p);
    ctx.save();
    ctx.translate(px + p.w / 2, py + p.h / 2); ctx.rotate(p.rot);
    ctx.shadowColor = '#0008'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#fbf7ef'; ctx.fillRect(-p.w / 2 - 8, -p.h / 2 - 8, p.w + 16, p.h + 30); // polaroid frame
    ctx.shadowColor = 'transparent';
    if (p.img) {
      const s = Math.min(p.w / p.img.width, p.h / p.img.height), iw = p.img.width * s, ih = p.img.height * s;
      ctx.drawImage(p.img, -iw / 2, -ih / 2, iw, ih);
    } else { ctx.fillStyle = '#333'; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.fillStyle = '#eee'; ctx.font = '14px system-ui'; ctx.textAlign = 'center'; ctx.fillText(p.type.startsWith('video') ? '▶ video' : p.name, 0, 4); }
    ctx.fillStyle = '#5a4632'; ctx.font = '12px ui-monospace, monospace'; ctx.textAlign = 'center';
    const mine = p.owner === id, have = files.has(p.pid);
    ctx.fillText(mine ? (net.peers[p.owner]?.name || name) + ' (mine)' : have ? '✓ yours, tap to save' : (net.peers[p.owner]?.name || '?'), 0, p.h / 2 + 16);
    ctx.restore();
  }
  ctx.restore();
  // orb
  const now = performance.now();
  const glow = (x, y, r, a = 1) => { const g = ctx.createRadialGradient(x, y, 2, x, y, r); g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(0.35, `rgba(255,220,140,${a})`); g.addColorStop(1, 'rgba(255,180,80,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
  ghosts = ghosts.filter((g) => now - g.t < 2500 && (glow(g.x, g.y, ORB * 2, 1 - (now - g.t) / 2500), true));
  const [ox, oy] = orbDrag ? [orbDrag.x, orbDrag.y] : home();
  glow(ox, oy, ORB * 2);
  const n = Object.keys(net.peers).length;
  $('hud').textContent = `table ${net.room.slice(6)} · ${name}${net.leader === id ? ' (time keeper)' : ''} · ${net.status}\n` +
    `devices ${n} · joins ${net.joins.length} · prints ${prints.size} · held here ${files.size}\n` +
    others().map((k) => `${net.peers[k].name}: ${peers.path(k)} (direct ${peers.state(k)})`).join('\n') +
    `\ndrag the orb to an edge to join screens`;
}
frame();
</script>

# Publishes two apps to GitHub Pages whenever main changes (#157):
# - the root is universal sharing, frozen at the universal-sharing-final tag, so old posts' links keep working;
# - /heap/ is main's web/, the heap rebrand as it's built.
# Public on purpose: a static site. Photos never go to this site or any server in readable form:
# they travel device to device, or through the room relay end-to-end encrypted.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4e58f6f80f007e37235af59af21c2a670d4ac203   # universal-sharing-final, pinned so moving the tag changes nothing
          path: frozen
      - run: |
          mkdir -p _site/heap
          cp -R frozen/web/. _site/
          cp -R web/. _site/heap/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
